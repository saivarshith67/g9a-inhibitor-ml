[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g9a-ml"
version = "0.1.0"
description = "Structured ML pipeline for predicting G9a inhibitors (Ivanova et al., Digital Discovery 2024)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "imbalanced-learn>=0.11",
  "xgboost>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "chemformula>=1.0",
  "rdkit>=2023.9.1",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
ann = ["torch>=2.0", "optuna>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
